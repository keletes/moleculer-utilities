name: Tag release

# Trunk-based release: every push to master runs semantic-release, which parses the Conventional Commit messages since
# the last release (see pr-title.yml and CLAUDE.md) to decide whether and what to release. When it does:
#   1. `yarn build` regenerates the built folders (mixins/, middlewares/, stores/, utils/) (prepareCmd in .releaserc.json)
#   2. the package (with the built folders) is published to GitHub Packages as @keletes/moleculer-utilities
#   3. the vX.Y.Z tag is created and a GitHub Release is published
#
# No release commit is pushed back (the protected master rejects it); package.json's version is a placeholder.
# The tag and release use the GitHub App installation token (org-level DEPLOY_APP_ID / DEPLOY_APP_PRIVATE_KEY);
# the publish uses the job's own GITHUB_TOKEN.
on:
  push:
    branches: [master]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: keletes
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          registry-url: https://npm.pkg.github.com
          scope: '@keletes'

      # No private packages: no PACKAGES_READ_PAT step.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Release
        run: yarn semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
